<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800">
  <defs>
    <!-- Filtro de ruído acústico (Speckle noise) típico de ultrassom -->
    <filter id="usg-speckle">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" result="noise" />
      <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 1 0" />
      <feComposite in2="SourceGraphic" in="noise" operator="arithmetic" k1="0.4" k2="0.6" k3="0" k4="0" />
    </filter>
    <radialGradient id="sector-fade" cx="500" cy="80" r="650" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020617" stop-opacity="1" />
    </radialGradient>
  </defs>

  <!-- Fundo do Monitor do Equipamento de Ultrassom -->
  <rect width="1000" height="800" fill="#020408" />

  <!-- Cabeçalho do Equipamento (Dados do USG) -->
  <g fill="#94a3b8" font-family="monospace" font-size="13">
    <text x="40" y="40" font-weight="bold" fill="#38bdf8">VET-ULTRASOUND PRO-9000 | TRANSDUTOR MICROCONVEXO</text>
    <text x="40" y="60">FREQ: 7.5 MHz | GANHO: 64dB | DR: 70 | MI: 0.9 | TIS: 0.4</text>
    <text x="40" y="80">PACIENTE: MEL (FELINO PERSA 5A) | CORTE: RIM D &amp; FÍGADO</text>
    <text x="820" y="40" text-anchor="end" fill="#f8fafc">CLÍNICA VETLIFE</text>
    <text x="820" y="60" text-anchor="end">FPS: 38 Hz</text>
  </g>

  <!-- Régua de Profundidade Lateral Direita (cm) -->
  <g transform="translate(920, 120)" stroke="#64748b" stroke-width="1.5" fill="#64748b" font-family="monospace" font-size="11">
    <line x1="0" y1="0" x2="0" y2="550" />
    <!-- Ticks -->
    <line x1="0" y1="0" x2="10" y2="0" /><text x="18" y="4">0</text>
    <line x1="0" y1="55" x2="6" y2="55" />
    <line x1="0" y1="110" x2="10" y2="110" /><text x="18" y="114">2</text>
    <line x1="0" y1="165" x2="6" y2="165" />
    <line x1="0" y1="220" x2="10" y2="220" /><text x="18" y="224">4</text>
    <line x1="0" y1="275" x2="6" y2="275" />
    <line x1="0" y1="330" x2="10" y2="330" /><text x="18" y="334">6</text>
    <line x1="0" y1="385" x2="6" y2="385" />
    <line x1="0" y1="440" x2="10" y2="440" /><text x="18" y="444">8</text>
    <line x1="0" y1="495" x2="6" y2="495" />
    <line x1="0" y1="550" x2="10" y2="550" /><text x="18" y="554">10 cm</text>
  </g>

  <!-- Setor Ultrassonográfico (Cone Acústico) -->
  <g>
    <!-- Feixe Acústico em Leque -->
    <path d="M 440 90 L 160 700 A 650 650 0 0 0 840 700 L 560 90 Z" fill="url(#sector-fade)" stroke="#1e293b" stroke-width="2"/>
    
    <!-- Parênquima Hepático (Cranial) -->
    <path d="M 400 130 Q 500 110 600 140 Q 700 240 680 340 Q 480 300 320 340 Q 300 220 400 130 Z" 
          fill="#475569" fill-opacity="0.45" />
    <!-- Vasos Portais Hiperecogênicos no Fígado -->
    <ellipse cx="440" cy="200" rx="14" ry="10" fill="#030712" stroke="#e2e8f0" stroke-width="2" />
    <ellipse cx="530" cy="220" rx="18" ry="12" fill="#030712" stroke="#e2e8f0" stroke-width="2" />
    <ellipse cx="610" cy="250" rx="12" ry="9" fill="#030712" stroke="#e2e8f0" stroke-width="1.8" />
    <text x="460" y="160" fill="#cbd5e1" font-size="12" font-family="sans-serif">FÍGADO (Ecotextura Fina Homogênea)</text>

    <!-- RIM DIREITO (Corte Sagital Anatômico) -->
    <g transform="translate(420, 360)">
      <!-- Cápsula Renal Hiperecogênica -->
      <path d="M 80 0 C 180 -10, 230 40, 230 110 C 230 180, 180 230, 80 220 C -20 210, -30 150, -30 110 C -30 70, -20 10, 80 0 Z" 
            fill="#334155" fill-opacity="0.6" stroke="#f8fafc" stroke-width="2.5" />
      
      <!-- Córtex Renal (Hipoecogênico em relação ao fígado) -->
      <!-- Medula Renal (Pirâmides anecogênicas / hipoecogênicas delimitadas) -->
      <ellipse cx="30" cy="65" rx="20" ry="14" fill="#090d16" stroke="#64748b" stroke-width="1"/>
      <ellipse cx="30" cy="115" rx="22" ry="15" fill="#090d16" stroke="#64748b" stroke-width="1"/>
      <ellipse cx="30" cy="165" rx="20" ry="14" fill="#090d16" stroke="#64748b" stroke-width="1"/>
      <ellipse cx="130" cy="65" rx="20" ry="14" fill="#090d16" stroke="#64748b" stroke-width="1"/>
      <ellipse cx="135" cy="115" rx="22" ry="15" fill="#090d16" stroke="#64748b" stroke-width="1"/>
      <ellipse cx="130" cy="165" rx="20" ry="14" fill="#090d16" stroke="#64748b" stroke-width="1"/>

      <!-- Pelve Renal / Seio Renal (Hiperecogênico Central com Gordura Peripélvica) -->
      <path d="M 70 50 L 95 50 L 90 180 L 65 180 Z" fill="#f1f5f9" opacity="0.85" />
      <text x="80" y="250" fill="#38bdf8" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">
        RIM DIREITO (3.8 cm • Distinção Corticomedular Preservada)
      </text>

      <!-- Caliper de Medição Longitudinal do Rim -->
      <line x1="80" y1="0" x2="80" y2="220" stroke="#facc15" stroke-width="1.5" stroke-dasharray="4 3"/>
      <circle cx="80" cy="0" r="3" fill="#facc15" />
      <circle cx="80" cy="220" r="3" fill="#facc15" />
      <text x="95" y="110" fill="#facc15" font-family="monospace" font-size="11" font-weight="bold">D1: 3.82 cm</text>
    </g>

    <!-- Foco / Marcador Acústico -->
    <polygon points="140,420 155,415 155,425" fill="#38bdf8" />
  </g>

  <!-- Rodapé do Aparelho -->
  <text x="40" y="760" fill="#64748b" font-family="monospace" font-size="12">
    FOCAL ZONE: 4.2cm | MAPA: B | REJEIÇÃO: 0 | POTÊNCIA: 100% | SAVE: SNAP-001
  </text>
</svg>
